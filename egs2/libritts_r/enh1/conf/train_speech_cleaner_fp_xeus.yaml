# ============================================================
# Speech Cleaner — Stage 1: Feature Predictor Training
# ============================================================
# Trains SSL encoder + LoRA adapters to predict clean SSL
# features from noisy waveforms.
#
# Switch SSL encoder via ssl_encoder + ssl_encoder_conf:
#   w2v_bert2 → target_layer: 8   (Sidon paper default)
#   xeus      → target_layer: 10? 6?
#   wavlm     → target_layer: 6
# ============================================================

# ── SSL encoder ──────────────────────────────────────────────
ssl_encoder: xeus          # choices: w2v_bert2 (8th) | xeus (10th?) | wavlm
ssl_encoder_conf:
    model_tag: xeus_checkpoint
    freeze_base: true

# use_flash_attention: false #true

target_layer: 10 #8                 # hidden state index to use as target
lora_rank: 64
lora_alpha: 16
lora_dropout: 0.1
input_sr: 16000

# ── Optimizer ────────────────────────────────────────────────
optim: adamw
optim_conf:
    lr: 8.0e-5 #4.0e-5 (espnet sidon)  #2.0e-5(sidon) 1.0e-4
    betas: [0.9, 0.999]
    weight_decay: 0.01
    eps: 1.0e-8

scheduler: null                 # constant LR for Stage 1

# ── Training ─────────────────────────────────────────────────
# Paper: 400k steps, batch size=256, 8×H200, ~4 days
max_epoch: 40 # =58epoch
batch_type: unsorted
batch_size: 128 #64(1) #32(2) #16(4)                  # per GPU (×8 GPU ×2 accum = effective 256)
accum_grad: 4 #2 #4 # gpu 4 x b 16 x accum 4 = 256 (=sidon) # 2 (if gpu:8)
grad_clip: 1.0
num_workers: 16 #4
seed: 42

# ── Validation ───────────────────────────────────────────────
valid_batch_size: 128 #32 #16
best_model_criterion:
    -   - valid
        - loss
        - min
keep_nbest_models: 3
log_interval: 200
use_amp: true

max_duration: 8.0 #20.0  # random crop threshold (seconds) in forward()
num_att_plot: 0
