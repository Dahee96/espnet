# ============================================================
# Speech Cleaner — Stage 1: Feature Predictor (w2v-BERT 2.0)
# Samsung PC: 4×A100 80GB
# ============================================================

# ── SSL encoder ──────────────────────────────────────────────
ssl_encoder: w2v_bert2
ssl_encoder_conf:
    model_tag: facebook/w2v-bert-2.0
    freeze_base: true
    use_flash_attention: false   # SDPA monkey-patch (PyTorch >= 2.0, no flash_attn pkg)

use_multilayer_loss: false #true
multilayer_mode: all
target_layer: 8
lora_rank: 64
lora_alpha: 16
lora_dropout: 0.1
input_sr: 16000

# ── On-the-fly degradation ────────────────────────────────────
noise_dir: data/noise_pool
rir_dir:   data/rir_pool
degrade_prob: 0.5
online_degradation: true

# ── Optimizer ────────────────────────────────────────────────
optim: adamw
optim_conf:
    lr: 1.0e-4 #8.0e-5
    betas: [0.9, 0.999]
    weight_decay: 0.01
    eps: 1.0e-8

scheduler: null

# ── Training ─────────────────────────────────────────────────
# Sidon: 400k steps, batch 256, 8×H200
# Samsung: 4 GPU × batch 64 × accum 1 = 256 effective  ✓
max_epoch: 30
batch_type: unsorted
batch_size: 64
accum_grad: 1
grad_clip: 1.0
num_workers: 16
seed: 42

# ── Validation ───────────────────────────────────────────────
valid_batch_size: 64
best_model_criterion:
    -   - valid
        - loss
        - min
keep_nbest_models: 3
log_interval: 200
use_amp: true

max_duration: 20.0
num_att_plot: 0