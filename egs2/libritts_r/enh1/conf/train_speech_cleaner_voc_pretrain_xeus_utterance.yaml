# ============================================================
# Speech Cleaner — Stage 2: Vocoder Pretrain
# ============================================================
# Trains HiFi-GAN + Snake vocoder on GROUND-TRUTH clean SSL
# features extracted from clean reference waveforms.
#
# Data flow:
#   clean 48kHz wav
#     → downsample to 16kHz (inside model)
#     → SSL encoder (frozen, no LoRA needed yet)
#     → ground-truth SSL features  [B, T_ssl, 1024]
#     → vocoder
#     → 48kHz reconstructed wav
#   Loss: mel-L1 + adversarial + feature matching
#
# NOTE: input data MUST be 48 kHz only (Sidon paper §3.4).
#       24 kHz LibriTTS-R is upsampled in run.sh Stage 3
#       before this training stage runs.
# ============================================================

# ── SSL encoder ──────────────────────────────────────────────
# Same model tag as Stage 1.
# In Stage 2 we do NOT load Stage 1 weights — the SSL encoder
# here is only used to extract GT SSL features from clean speech
# (extract_clean_features(), no gradient, no LoRA needed).
ssl_encoder: xeus          # choices: w2v_bert2 | xeus | wavlm
ssl_encoder_conf:
    model_tag: xeus_checkpoint
    freeze_base: true
    use_flash_attention: true

target_layer: 10
lora_rank: 64                   # unused in Stage 2 (encoder frozen, no LoRA fwd)
lora_alpha: 16
lora_dropout: 0.1
input_sr: 16000

# ── On-the-fly degradation ────────────────────────────────────
noise_dir: data/noise_pool       # populated by data.sh from NOISE_* in db.sh
rir_dir:   data/rir_pool         # populated by Stage 3 (prepare_rir_pool.py)
degrade_prob: 0.5                # probability per degradation type (Sidon: 0.5)
online_degradation: true         # set false to use pre-degraded wav.scp

# ── Vocoder architecture ─────────────────────────────────────
ssl_dim: 1024                   # w2v-BERT 2.0 hidden_size
                                # WavLM-large  → 1024
                                # XEUS         → check model config
use_multilayer_loss: true
use_multilayer_feat: true
multilayer_mode: all
layer_weighting: utterance_dynamic  # uniform | global_learnable | utterance_dynamic | frame_dynamic
# ── Stage selector ───────────────────────────────────────────
use_predicted_feat: false       # ← Stage 2: ground-truth SSL features
vocoder_type: dac       # choices: hifigan | dac

# ── Loss weights ─────────────────────────────────────────────
# Sidon: regression_loss=15.0, adv_gen=2.0, adv_feature=1.0
mel_loss_weight: 15.0           # dominant term (following HiFi-GAN paper >> 45.0)
adv_loss_weight: 2.0
fm_loss_weight: 1.0

# ── Optimizers (GANTrainer: two optimizers) ──────────────────
optim: adamw
optim_conf:
    lr:  2.0e-4 #1.0e-4
    betas: [0.8, 0.98]
    weight_decay: 0.01

scheduler: exponentiallr
scheduler_conf:
    gamma: 0.999992 #0.999996              # applied to both generator and discriminator

# ── Training ─────────────────────────────────────────────────
# Paper: 140k steps, batch_size=32, 8×H200, ~2 days
max_epoch: 50 #35
batch_type: unsorted
batch_size: 32 #8                   # per GPU  (×8 GPUs = effective bs 32)
grad_clip: 1.0
num_workers: 16
seed: 42

# ── Validation ───────────────────────────────────────────────
valid_batch_size: 32 #8
# best_model_criterion:
#     -   - valid
#         - loss_G
#         - min
best_model_criterion:
    -   - valid
        - dnsmos_ovrl
        - max
    -   - valid
        - stoi
        - max
    -   - valid
        - loss_G
        - min
keep_nbest_models: 5
log_interval: 100

use_amp: false # espnet gan_trainer.py uses float16
max_duration: 2.0  # random crop threshold (seconds) in forward()
num_att_plot: 0
